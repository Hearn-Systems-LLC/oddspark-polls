name: Deploy gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel mid-flight: a cancelled run between production migration and
  # production deploy would leave prod schema ahead of code. Queue instead.
  cancel-in-progress: false

env:
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "11.17.0"

jobs:
  test-and-build:
    name: Tests → build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the migration guard can diff against the base branch
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migration guard
        env:
          # Anchors historical-migration immutability to history: PR base on
          # pull_request, the pre-push HEAD on push (the deploy path).
          MIGRATIONS_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || '' }}
        run: pnpm migrations:guard

      # The provisioning unit tests spawn the real provision-auth-secrets.zsh;
      # ubuntu runners ship without zsh (actions/runner-images#4849).
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Unit + integration tests
        run: pnpm test

      - name: Type check
        run: pnpm check

      # E2E runs the real dev server: it needs Playwright's browser, local D1
      # migrations applied, and a throwaway .dev.vars — generated here, never
      # a real secret (no OAuth round-trip happens in e2e).
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply local D1 migrations
        run: pnpm migrate:local

      - name: Write throwaway local auth env
        # Binding/type/deploy truth is `secrets.required` in wrangler.jsonc.
        # Keep VOTE_DIGEST_SECRET last for provisioning-script consistency;
        # local/CI uses Cloudflare's official always-pass Turnstile dummy.
        run: |
          {
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            echo "BETTER_AUTH_URL=http://127.0.0.1:4391"
            echo "GOOGLE_CLIENT_ID=ci-placeholder"
            echo "GOOGLE_CLIENT_SECRET=ci-placeholder"
            echo "GITHUB_CLIENT_ID=ci-placeholder"
            echo "GITHUB_CLIENT_SECRET=ci-placeholder"
            echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA"
            echo "VOTE_DIGEST_SECRET=$(openssl rand -base64 32)"
          } > .dev.vars

      - name: E2E tests
        run: pnpm test:e2e

      - name: Refresh binding types
        run: pnpm types

      # Fail the gate when the committed worker-configuration.d.ts is stale
      # relative to what `wrangler types` generates from wrangler.jsonc plus
      # the throwaway .dev.vars above (key order matters — see its comment).
      - name: Binding types drift check
        run: git diff --exit-code worker-configuration.d.ts

      # Build the production-flavored artifact — the same CLOUDFLARE_ENV the
      # deploy jobs rebuild with — so the gate tests what actually ships.
      - name: Build
        run: pnpm build:production

  deploy-staging:
    name: Staging preflight → migrate → deploy → smoke
    needs: test-and-build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Staging Demo Poll preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm preflight:demo staging

      - name: Staging migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm migrate:staging

      # deploy:staging rebuilds with CLOUDFLARE_ENV=staging and bundles for upload
      - name: Staging deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:staging

      - name: Staging smoke
        env:
          SMOKE_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "$SMOKE_URL" ]; then
            SMOKE_URL="https://oddspark-polls-staging.hearnsystems.workers.dev"
          fi
          # workers.dev DNS can lag a few seconds after first deploy
          for i in 1 2 3 4 5; do
            if SMOKE_URL="$SMOKE_URL" pnpm smoke:staging; then
              exit 0
            fi
            sleep 3
          done
          exit 1

  deploy-production:
    name: Production preflight → migrate → deploy → smoke
    needs: deploy-staging
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Promotion is forbidden unless the already-live configured aggregate
      # matches the exact provider-free Demo contract. The query returns only
      # ready/not_ready and never emits identities or internal IDs.
      - name: Production Demo Poll preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm preflight:demo production

      - name: Production migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm migrate:production

      - name: Production deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:production

      - name: Production smoke
        env:
          SMOKE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$SMOKE_URL" ]; then
            SMOKE_URL="https://oddspark-polls.hearnsystems.workers.dev"
          fi
          for i in 1 2 3 4 5; do
            if SMOKE_URL="$SMOKE_URL" pnpm smoke:staging; then
              exit 0
            fi
            sleep 3
          done
          exit 1
